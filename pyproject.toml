[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-psu-control"
version = "0.1.0"
description = "Control API for Elektro-Automatik PS 2000B series power supplies (e.g. EA-PS 2084-10B)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
